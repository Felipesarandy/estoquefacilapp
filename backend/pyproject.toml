[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "estoquefacil"
version = "0.1.0"
description = "EstoqueFácil Equihealth — API de estoque de insumos do haras (Flask)"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-JWT-Extended>=4.6",
    "Flask-Cors>=4.0",
    "python-dotenv",
    "tzdata",  # banco de fusos (o Windows nao tras um)
]

[project.optional-dependencies]
dev = ["invoke"]
test = ["pytest>=8.3", "pytest-flask"]
postgres = ["psycopg2-binary"]

[tool.setuptools]
packages = [
    "app",
    "app.models",
    "app.api",
    "app.schemas",
    "app.services",
]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: permite test_alerts.py em tests/api/ e em tests/services/
addopts = "--import-mode=importlib"
